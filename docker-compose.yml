services:
  db:
    image: postgres:15
    container_name: focus_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focus_net 

  mqtt:
    image: eclipse-mosquitto:2
    container_name: focus_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - focus_net

  api:
    build: ./focusbot-server
    container_name: focus_api
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./focusbot-server:/app
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER=focus_mqtt
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_PORT=${MQTT_PORT}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - focus_net

networks:
  focus_net:
    driver: bridge